services:
  z-lottery:
    image: jiuwusan/z-lottery:latest
    container_name: z-lottery
    ports:
      - '3100:3000'
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /app/data/lottery.sqlite
      CHECK_ENABLED: '${CHECK_ENABLED:-true}'
      CHECK_SCHEDULE: '${CHECK_SCHEDULE:-*/20 22-23 * * *;0 0 * * *}'
      CHECK_TIMEZONE: '${CHECK_TIMEZONE:-Asia/Shanghai}'
    volumes:
      - lottery-data:/app/data
    restart: always
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wk

networks:
  wk:
    external: true

volumes:
  lottery-data:
